<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Builder — Contributor Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05070c;
    --panel:#0c111c;
    --steel:#1b2233;
    --cyan:#00e5ff;
    --purple:#8b5cf6;
    --amber:#ffb020;
    --ghost:#e8edf5;
    --dim:#7a8399;
    --danger:#ff4d6d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(0,229,255,.08), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(139,92,246,.10), transparent 55%),
      var(--void);
    color:var(--ghost);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .display{font-family:'Chakra Petch',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  header{max-width:1180px;margin:0 auto 8px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  h1{
    font-family:'Chakra Petch',sans-serif;
    font-weight:700;font-size:clamp(28px,4vw,42px);
    margin:0 0 6px;letter-spacing:.01em;
  }
  h1 span{color:var(--dim);font-weight:500;}
  nav{display:flex;gap:10px;flex-wrap:wrap;}
  nav a{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--dim);
    text-decoration:none;border:1px solid var(--steel);padding:7px 12px;border-radius:3px;
  }
  nav a:hover{color:var(--ghost);border-color:var(--cyan);}

  .sub{max-width:1180px;margin:0 auto 26px;color:var(--dim);font-size:14px;}

  .layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:28px;}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}

  .panel{background:var(--panel);border:1px solid var(--steel);padding:20px;border-radius:4px;}
  .panel + .panel{margin-top:20px;}

  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  label{
    display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    color:var(--dim);letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase;
  }
  input[type="text"], input[type="number"], select{
    width:100%;background:#0a0e17;border:1px solid var(--steel);
    color:var(--ghost);font-family:'JetBrains Mono',monospace;font-size:13.5px;
    padding:10px 12px;border-radius:3px;outline:none;
  }
  input::placeholder{color:#4d5568;}
  input:focus, select:focus{border-color:var(--cyan);}

  .colorField{display:flex;gap:8px;align-items:center;}
  .colorField input[type="color"]{
    width:38px;height:38px;padding:0;border:1px solid var(--steel);border-radius:3px;
    background:none;cursor:pointer;
  }
  .colorField input[type="text"]{flex:1;}

  .typeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .typeBtn{
    font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.02em;
    background:transparent;border:1px solid var(--steel);color:var(--dim);
    padding:10px 8px;border-radius:3px;cursor:pointer;text-align:center;
  }
  .typeBtn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.08);}

  .trophyGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 10px;}
  .trophyChip{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--dim);}
  .trophyChip input{accent-color:var(--cyan);}

  .hint{font-family:'JetBrains Mono',monospace;font-size:11px;color:#4d5568;margin-top:6px;line-height:1.5;}

  .previewBox{
    min-height:220px;display:flex;align-items:center;justify-content:center;
    background:#0a0e17;border:1px dashed var(--steel);border-radius:4px;padding:24px;margin-bottom:18px;
  }
  .previewBox img{max-width:100%;height:auto;display:block;}
  .previewBox .msg{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--dim);text-align:center;}
  .previewBox .msg.err{color:var(--danger);}

  .outRow{margin-bottom:14px;}
  .outRow label{margin-bottom:8px;}
  .outBox{
    display:flex;gap:8px;align-items:flex-start;
  }
  textarea{
    flex:1;resize:vertical;min-height:44px;
    background:#0a0e17;border:1px solid var(--steel);color:var(--ghost);
    font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:10px 12px;border-radius:3px;
    outline:none;
  }
  textarea:focus{border-color:var(--cyan);}
  button.copyBtn{
    font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.03em;
    background:transparent;border:1px solid var(--cyan);color:var(--cyan);
    padding:0 14px;border-radius:3px;cursor:pointer;white-space:nowrap;
    align-self:stretch;
  }
  button.copyBtn:hover{background:var(--cyan);color:var(--void);}

  footer{max-width:1180px;margin:36px auto 0;color:#5a6480;font-size:12.5px;}
  footer a{color:#5a6480;}
</style>
</head>
<body>

<header>
  <h1>Card <span>Builder</span></h1>
  <nav><a href="/">← home</a> <a href="/roster.html">roster →</a></nav>
</header>
<p class="sub mono">Pick a card, fill in the fields, copy the markdown. No GitHub token needed unless you're generating a lot of cards.</p>

<div class="layout">
  <div class="col-form">
    <div class="panel">
      <div class="field">
        <label>Card type</label>
        <div class="typeGrid" id="typeGrid">
          <button class="typeBtn active" data-type="card">Contributor</button>
          <button class="typeBtn" data-type="leaderboard">Leaderboard</button>
          <button class="typeBtn" data-type="repo">Repository</button>
          <button class="typeBtn" data-type="trophies">Achievements</button>
        </div>
      </div>

      <div id="dynamicFields"></div>

      <div class="field" id="themeField">
        <label>Theme</label>
        <select id="themeSelect"></select>
      </div>

      <div class="field" id="colorFieldWrap">
        <label>Accent color</label>
        <div class="colorField">
          <input type="color" id="colorPicker" value="#00e5ff">
          <input type="text" id="colorText" class="mono" placeholder="00e5ff (optional)">
        </div>
        <p class="hint">Leave the text field empty to use the theme's default accent.</p>
      </div>
    </div>
  </div>

  <div class="col-preview">
    <div class="panel">
      <div class="previewBox" id="previewBox"><span class="msg">fill in the fields to preview</span></div>

      <div class="outRow">
        <label class="mono">Markdown</label>
        <div class="outBox">
          <textarea id="mdOut" class="mono" readonly rows="2"></textarea>
          <button class="copyBtn" data-target="mdOut">Copy</button>
        </div>
      </div>
      <div class="outRow">
        <label class="mono">Direct URL</label>
        <div class="outBox">
          <textarea id="urlOut" class="mono" readonly rows="2"></textarea>
          <button class="copyBtn" data-target="urlOut">Copy</button>
        </div>
      </div>
      <div class="outRow">
        <label class="mono">HTML &lt;img&gt;</label>
        <div class="outBox">
          <textarea id="htmlOut" class="mono" readonly rows="2"></textarea>
          <button class="copyBtn" data-target="htmlOut">Copy</button>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="mono">Contributor Codex — <a href="https://github.com/boy-offi9-inc/Contributor-Codex">source</a></footer>

<script>
const API_BASE = 'https://contributor-codex.vercel.app';

const TYPES = {
  card: {
    endpoint: '/api/card',
    themes: ['cyberpunk', 'terminal', 'glass', 'detailed'],
    fields: [
      { key: 'username', label: 'GitHub username', placeholder: 'octocat', required: true },
    ],
  },
  leaderboard: {
    endpoint: '/api/leaderboard',
    themes: ['cyberpunk', 'terminal', 'glass'],
    fields: [
      { key: 'org', label: 'Organization', placeholder: 'boy-offi9-inc', required: true },
      { key: 'limit', label: 'Member limit (1-20)', placeholder: '10', type: 'number', min: 1, max: 20 },
    ],
  },
  repo: {
    endpoint: '/api/repo',
    themes: ['cyberpunk', 'terminal', 'glass', 'detailed'],
    fields: [
      { key: 'owner', label: 'Repo owner', placeholder: 'boy-offi9-inc', required: true },
      { key: 'repo', label: 'Repo name', placeholder: 'Contributor-Codex', required: true },
    ],
  },
  trophies: {
    endpoint: '/api/trophies',
    themes: null,
    fields: [
      { key: 'username', label: 'GitHub username', placeholder: 'octocat', required: true },
    ],
    trophyPicker: true,
  },
};
const ALL_TROPHIES = ['STARGAZER', 'BUILDER', 'INFLUENCE', 'VETERAN', 'POLYGLOT', 'FORKED', 'OPEN_SOURCE'];

let currentType = 'card';
const state = {};

const dynamicFields = document.getElementById('dynamicFields');
const themeField = document.getElementById('themeField');
const themeSelect = document.getElementById('themeSelect');
const colorFieldWrap = document.getElementById('colorFieldWrap');
const colorPicker = document.getElementById('colorPicker');
const colorText = document.getElementById('colorText');
const previewBox = document.getElementById('previewBox');
const mdOut = document.getElementById('mdOut');
const urlOut = document.getElementById('urlOut');
const htmlOut = document.getElementById('htmlOut');

function renderFields(){
  const def = TYPES[currentType];
  dynamicFields.innerHTML = def.fields.map(f => `
    <div class="field">
      <label>${f.label}</label>
      <input type="${f.type || 'text'}" id="f_${f.key}" class="mono" placeholder="${f.placeholder || ''}"
        ${f.min !== undefined ? `min="${f.min}"` : ''} ${f.max !== undefined ? `max="${f.max}"` : ''}
        value="${state[f.key] || ''}">
    </div>`).join('');

  if (def.trophyPicker) {
    dynamicFields.innerHTML += `
      <div class="field">
        <label>Trophies (none selected = show all)</label>
        <div class="trophyGrid" id="trophyGrid">
          ${ALL_TROPHIES.map(t => `
            <label class="trophyChip"><input type="checkbox" value="${t}" ${state.trophies?.includes(t) ? 'checked' : ''}> ${t}</label>
          `).join('')}
        </div>
      </div>`;
  }

  def.fields.forEach(f => {
    document.getElementById(`f_${f.key}`).addEventListener('input', (e) => {
      state[f.key] = e.target.value;
      update();
    });
  });
  if (def.trophyPicker) {
    document.querySelectorAll('#trophyGrid input').forEach(cb => {
      cb.addEventListener('change', () => {
        const checked = [...document.querySelectorAll('#trophyGrid input:checked')].map(c => c.value);
        state.trophies = checked;
        update();
      });
    });
  }

  if (def.themes) {
    themeField.style.display = '';
    themeSelect.innerHTML = def.themes.map(t => `<option value="${t}">${t}</option>`).join('');
    themeSelect.value = state.theme && def.themes.includes(state.theme) ? state.theme : def.themes[0];
    state.theme = themeSelect.value;
  } else {
    themeField.style.display = 'none';
  }
  colorFieldWrap.style.display = currentType === 'trophies' ? 'none' : '';
}

function buildUrl(){
  const def = TYPES[currentType];
  const params = new URLSearchParams();
  let missing = false;

  def.fields.forEach(f => {
    const val = (state[f.key] || '').trim();
    if (f.required && !val) missing = true;
    if (val) params.set(f.key, val);
  });

  if (def.trophyPicker && state.trophies && state.trophies.length) {
    params.set('trophies', state.trophies.join(','));
  }
  if (def.themes && state.theme) params.set('theme', state.theme);
  if (currentType !== 'trophies') {
    const color = (colorText.value || '').trim().replace(/^#/, '');
    if (/^[0-9a-fA-F]{6}$/.test(color)) params.set('color', color);
  }

  return { url: `${API_BASE}${def.endpoint}?${params.toString()}`, missing };
}

let debounceTimer;
function update(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const { url, missing } = buildUrl();
    if (missing) {
      previewBox.innerHTML = '<span class="msg">fill in the required fields to preview</span>';
      mdOut.value = ''; urlOut.value = ''; htmlOut.value = '';
      return;
    }
    mdOut.value = `![Card](${url})`;
    urlOut.value = url;
    htmlOut.value = `<img src="${url}" alt="card">`;

    previewBox.innerHTML = '<span class="msg">loading…</span>';
    const img = new Image();
    img.alt = 'card preview';
    img.onload = () => { previewBox.innerHTML = ''; previewBox.appendChild(img); };
    img.onerror = () => { previewBox.innerHTML = '<span class="msg err">failed to load — check the fields above</span>'; };
    img.src = url;
  }, 400);
}

document.getElementById('typeGrid').addEventListener('click', (e) => {
  const btn = e.target.closest('.typeBtn');
  if (!btn) return;
  document.querySelectorAll('.typeBtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentType = btn.dataset.type;
  renderFields();
  update();
});

themeSelect.addEventListener('change', () => { state.theme = themeSelect.value; update(); });
colorPicker.addEventListener('input', () => { colorText.value = colorPicker.value.replace(/^#/, ''); update(); });
colorText.addEventListener('input', update);

document.querySelectorAll('.copyBtn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const target = document.getElementById(btn.dataset.target);
    if (!target.value) return;
    try {
      await navigator.clipboard.writeText(target.value);
      const original = btn.textContent;
      btn.textContent = 'Copied ✓';
      setTimeout(() => { btn.textContent = original; }, 1500);
    } catch {
      target.select();
      btn.textContent = 'Select & copy manually';
    }
  });
});

renderFields();
</script>
</body>
</html>
