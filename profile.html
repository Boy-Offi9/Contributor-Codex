<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070c">
<title>Codex Profile — Contributor Codex</title>
<meta name="description" content="A shareable Contributor Codex profile page for any GitHub user: generated cards, achievements, bio and top repositories.">
<meta property="og:title" content="Codex Profile — Contributor Codex">
<meta property="og:description" content="A shareable Contributor Codex profile page for any GitHub user: generated cards, achievements, bio and top repositories.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="wrap">
    <a class="wordmark" href="./"><img src="assets/favicon.svg" alt="" width="24" height="24">Contributor <span>Codex</span></a>
    <nav aria-label="Primary"><a href="roster.html">roster</a><a href="builder.html">card builder</a><a href="profile.html" aria-current="page">codex profile</a></nav>
  </div>
</header>

<main id="main" class="wrap narrow">
  <div class="pageHead">
    <h1>Codex <span>Profile</span></h1>
    <p>A shareable page per contributor: the generated cards plus bio, location, and top repositories.</p>
  </div>

  <div class="lookup">
    <label class="sr-only" for="userInput">GitHub username</label>
    <input type="text" id="userInput" class="mono w-sm" placeholder="GitHub username" autocomplete="off" spellcheck="false">
    <button class="btn" id="loadBtn" type="button">Load profile</button>
    <label class="sr-only" for="tokenInput">GitHub token (optional)</label>
    <input type="password" id="tokenInput" class="mono w-md" placeholder="GitHub token (optional)" autocomplete="off" title="Raises the rate limit from 60/hr to 5,000/hr. Stays in this tab, only sent to api.github.com.">
  </div>

  <div id="status" class="status mono" role="status" aria-live="polite"></div>

  <div id="profile">
    <div class="profileHero" id="hero"></div>
    <div class="statTiles" id="statTiles"></div>

    <div class="cardsRow">
      <div>
        <p class="sectionLabel mono">Contributor Card</p>
        <div class="cardShell" id="cardShell"></div>
        <button class="btn ghost sm" id="cardCopy" type="button">Copy markdown</button>
      </div>
      <div>
        <p class="sectionLabel mono">Achievements</p>
        <div class="cardShell" id="trophyShell"></div>
        <button class="btn ghost sm" id="trophyCopy" type="button">Copy markdown</button>
      </div>
    </div>

    <p class="sectionLabel mono">Top Repositories</p>
    <ul class="repoList" id="repoList"></ul>
  </div>
</main>
<footer class="siteFooter mono">
  <span>Contributor Codex</span>
  <a href="https://github.com/Boy-Offi9/Contributor-Codex" target="_blank" rel="noopener">source on GitHub</a>
</footer>

<script src="assets/js/common.js"></script>
<script src="assets/js/profile.js"></script>
<script src="assets/js/analytics.js" defer></script>
</body>
</html>
